[package]
name = "vendorit"
version = "0.1.0"
edition = "2024"
description = "Vendored dependencies manager"
authors = ["Sasha Koss <koss@nocorp.me>"]
license = "MIT"
repository = "https://github.com/kossnocorp/vendorit"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
reqwest = { version = "0.12.28", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
tempfile = "3.26.0"
tokio = { version = "1.53.1", features = ["full"] }
toml = "0.9.8"
